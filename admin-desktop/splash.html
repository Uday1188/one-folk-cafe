<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>One Folk Cafe Admin - Launching</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #2c1b12 0%, #150d09 70%, #0c0705 100%);
      color: #f5ebe0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(212, 163, 115, 0.25);
      border-radius: 16px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      width: 100%;
      max-width: 420px;
    }
    .logo-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 24px;
    }
    .logo-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(226, 149, 120, 0.45) 0%, rgba(226, 149, 120, 0) 70%);
      filter: blur(14px);
      border-radius: 50%;
      animation: pulse-glow 2.5s infinite ease-in-out;
    }
    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      border: 2px solid rgba(212, 163, 115, 0.5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      background: #ffffff;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fefae0;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4a373;
      background: rgba(212, 163, 115, 0.12);
      border: 1px solid rgba(212, 163, 115, 0.3);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 28px;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d4a373 0%, #e29578 50%, #d4a373 100%);
      border-radius: 10px;
      transition: width 0.3s ease;
      animation: shimmer 1.8s infinite linear;
      background-size: 200% 100%;
    }
    .status-text {
      font-size: 13px;
      color: rgba(245, 235, 224, 0.75);
      letter-spacing: 0.5px;
      min-height: 20px;
      font-weight: 400;
    }
    .version {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      color: rgba(212, 163, 115, 0.5);
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="resources/icon.png" class="logo-img" alt="Logo" onerror="this.src='../frontend/public/logo.png'">
    </div>
    <h1>One Folk Cafe</h1>
    <div class="badge">Desktop Admin Suite</div>
    
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Starting local application service...</div>
  </div>
  <div class="version">v1.0.0 • SQLite Offline Edition</div>

  <script>
    const steps = [
      { progress: 20, text: 'Initializing local environment...' },
      { progress: 40, text: 'Starting Spring Boot backend engine...' },
      { progress: 65, text: 'Verifying SQLite database schema...' },
      { progress: 85, text: 'Connecting local desktop bridge...' },
      { progress: 100, text: 'Ready! Launching dashboard...' }
    ];
    let stepIndex = 0;
    const bar = document.getElementById('progressBar');
    const label = document.getElementById('statusText');

    function advance() {
      if (stepIndex < steps.length) {
        bar.style.width = steps[stepIndex].progress + '%';
        label.innerText = steps[stepIndex].text;
        stepIndex++;
        setTimeout(advance, 800);
      }
    }
    setTimeout(advance, 300);

    // Can receive real updates from Electron if desired
    if (window.electronAPI) {
      window.electronAPI.onStatusUpdate((msg) => {
        if (msg.progress) bar.style.width = msg.progress + '%';
        if (msg.text) label.innerText = msg.text;
      });
    }
  </script>
</body>
</html>
